[project]
name = "event_bus"
version = "1.0.0"
requires-python = ">=3.12"

dependencies = [
    # http
    "aiohttp",
    "aiostream",

    # data
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "event_bus[test]"
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["event_bus"]

[tool.setuptools.packages.find]
where = ["src"]