[project]
name = "infinity_bus"
version = "1.3.5"
description = "基于 asyncio 的轻量级事件总线，支持发布/订阅、正则匹配、背压控制与优雅停机"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "infinity_system: yin_bailiang" }
]
keywords = [
    "event-bus",
    "async",
    "asyncio",
    "pub-sub",
    "publish-subscribe",
    "event-driven",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]
requires-python = ">=3.12"

dependencies = [
    "pydantic",
]

[project.urls]
Repository = "https://github.com/yinbailiang/event_bus"

[project.optional-dependencies]
templates = [
    "aiosqlite",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "infinity_bus[templates]",
]
dev = [
    "interrogate",
    "pre-commit",
    "infinity_bus[templates]",
    "infinity_bus[test]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not slow'"
markers = [
    "slow: long-running stress / stability tests",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "ASYNC",  # async/await best practices
    "PLE",    # pylint errors
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "ASYNC109", # async function with timeout parameter (intentional API design)
]

[tool.ruff.lint.isort]
known-first-party = ["event_bus"]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
line-ending = "lf"

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportMissingImports = "error"
exclude = ["tests", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]
venvPath = "."
venv = ".venv"

[tool.interrogate]
fail-under = 60
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-private = true
ignore-semiprivate = true
ignore-nested-functions = true
